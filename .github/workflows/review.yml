name: Review

# Reusable AI review workflow for pull requests (optional — adopt by adding a
# caller workflow; skip it and nothing changes). Two jobs, in parallel with the
# gates:
#
#   triage     — decides on a bare runner whether the diff contains anything
#                worth paying a reviewer for (see `skip-paths`). No model is
#                invoked, so a skipped review costs Actions seconds.
#   review     — the "Thermonuclear Review": a deliberately adversarial audit
#                of the PR diff, posted as a tracking comment led by the
#                marker line `## Thermonuclear Review` (downstream automation
#                can key off that marker). Shows as SKIPPED when triage says
#                there is no code here; `/colormath:ship` reads that as
#                "nothing to audit", distinct from a review that errored.
#
# QA is deliberately NOT here. It used to run as a second `test-plan` agent
# that posted a `## Test Plan` comment on every PR; that plan is now owned by
# the ticket in Abacus and executed by `/colormath:ship` against a running
# stack. A plan posted by CI could only ever be a static checklist — nothing
# in a workflow can bring the app up, log in as three roles and watch the
# behavior — so the plan lived where it could not be executed, and paid for a
# second agent on every PR to put it there.
#
# Consumers call this with:
#
#   name: claude-review
#   on:
#     pull_request:
#       types: [opened, reopened, ready_for_review]   # every created PR
#     issue_comment:                                  # "@claude" re-runs
#       types: [created]
#     pull_request_review_comment:
#       types: [created]
#   jobs:
#     review:
#       uses: ColorMath/ci/.github/workflows/review.yml@vX.Y.Z  # see /releases/latest
#       permissions:
#         contents: read
#         pull-requests: write
#         issues: write
#         id-token: write
#       secrets:
#         anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
#       with:
#         review-focus: "Pay attention to <project-specific hot spots>."
#
# The job-level `if:` conditions below read the CALLER's event, so the
# caller declares the triggers and this workflow decides when to run:
# non-draft PR opened/reopened/readied, or "@claude" mentioned in any PR
# comment (conversation or inline review).

on:
  workflow_call:
    inputs:
      model:
        description: Fallback model, used when review-model is not set.
        type: string
        default: "claude-sonnet-4-6"
      review-model:
        description: >-
          Model for the review agent. Empty falls back to `model`. Kept on
          Sonnet by default: adversarial review is where model tier actually
          buys findings.
        type: string
        default: ""
      review-effort:
        description: >-
          Claude Code `--effort` for the review agent (low | medium | high |
          max; xhigh needs Opus 4.7+). Empty passes no flag. Defaults to `low`:
          measured over 30 intendent reviews, cost tracks turn count (r=0.86)
          more than diff size, and effort is the input that most directly buys
          turns. Raise it on a repo where the reviewer is missing things.
        type: string
        default: "low"
      review-focus:
        description: Extra project-specific emphasis appended to the review prompt (e.g. sensitive surfaces to scrutinize)
        type: string
        default: ""
      skip-paths:
        description: >-
          Newline-separated globs. The review is skipped only when EVERY file
          in the PR matches one of them — a PR touching code *and* docs is
          still reviewed in full, docs included. Set to an empty string to
          review every PR.
        type: string
        default: |
          **/*.md
          **/*.lock
          **/package-lock.json
          LICENSE
      enable-review:
        type: boolean
        default: true
    secrets:
      anthropic_api_key:
        description: Anthropic API key used by the review agent
        required: true

jobs:
  # Decides whether this diff is worth paying a reviewer for, before any model
  # is invoked. Runs on a bare runner and calls one REST endpoint, so a skipped
  # review costs Actions seconds instead of the ~$0.68 a review averages.
  triage:
    # Run when a non-draft PR is opened/reopened/marked ready, OR when someone
    # mentions @claude in a comment on a PR (issue_comment fires on issues too,
    # so gate on `.issue.pull_request` to ensure the comment is on a PR).
    if: |
      inputs.enable-review &&
      ((github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude')) ||
       (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read      # list the PR's changed files
    outputs:
      reviewable: ${{ steps.decide.outputs.reviewable }}
    steps:
      - name: Is there anything here worth reviewing?
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Both comment events carry the PR number as .issue.number; only
          # pull_request carries .pull_request.number. Same fallback the
          # concurrency groups use.
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          SKIP_PATHS: ${{ inputs.skip-paths }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' > files.txt
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import fnmatch, os

          files = [l.strip() for l in open("files.txt") if l.strip()]
          pats = [p.strip() for p in os.environ["SKIP_PATHS"].splitlines() if p.strip()]

          def skippable(path):
              for p in pats:
                  # fnmatch's '*' already crosses '/', so a '**/' prefix is
                  # redundant for nested paths but stops the pattern matching a
                  # root-level file. Test the stripped form too so '**/*.md'
                  # covers both 'docs/a.md' and 'README.md'.
                  if fnmatch.fnmatch(path, p): return True
                  if p.startswith("**/") and fnmatch.fnmatch(path, p[3:]): return True
              return False

          unreviewed = [f for f in files if skippable(f)]
          reviewable = bool(files) and len(unreviewed) < len(files)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(f"## Review triage\n\n{len(files)} changed file(s); "
                      f"{len(unreviewed)} matched `skip-paths`.\n\n")
              s.write("Reviewing this PR.\n" if reviewable else
                      "**Skipped** — every changed file matches `skip-paths`, "
                      "so there is no code here to audit.\n")
              if not files:
                  s.write("\n(No files reported for this PR.)\n")
              s.write("\n" + "\n".join(f"- `{f}`" + ("" if f in unreviewed else "  ← reviewable")
                                       for f in files[:50]) + "\n")

          print(f"reviewable={'true' if reviewable else 'false'}")
          PY

  review:
    needs: [triage]
    if: needs.triage.outputs.reviewable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read          # review-only: does NOT push commits
      pull-requests: write     # post the review + inline comments
      issues: write            # post the tracking comment on comment-triggered runs
      id-token: write          # OIDC
    concurrency:
      # pull_request_review_comment carries .pull_request.number; issue_comment
      # carries the PR number as .issue.number. Fall back across both so a
      # comment-triggered run shares the per-PR group (and cancels a stale run).
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0       # full history so it can diff against base
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          # track_progress forces "tag mode": the action creates a tracking
          # comment on the PR and wires up the inline-comment + comment-update
          # tools, so Claude can ALWAYS post its summary (and inline findings)
          # even on an automation trigger. Without it, prompt mode has nowhere
          # to post and the review silently goes only to the job log.
          track_progress: true
          # --verbose streams every turn/tool-call to the Actions log so the
          # run is easy to follow live. --effort is appended only when the
          # caller sets it, so the default arg string is byte-identical to
          # what shipped before these inputs existed.
          claude_args: "--model ${{ inputs.review-model || inputs.model }} --verbose${{ inputs.review-effort && format(' --effort {0}', inputs.review-effort) || '' }}"
          prompt: |
            You are running a THERMONUCLEAR review: an unusually strict,
            adversarial audit of this PR's diff. Assume the author and their
            AI pair share blind spots, so nothing slips through. Review ONLY
            code added or modified in this PR; use the rest of the codebase
            as context, not as a target.

            Audit across four fronts:

            1. Correctness & breaking changes — logic errors, unhandled edge
               cases, error and exception paths, race conditions, and any
               change that silently breaks existing behavior, callers, or
               feature flags/gates.
            2. Security — injection, authz gaps, unsafe deserialization,
               secret handling, SSRF and path traversal, and any untrusted
               input flow.
            3. Maintainability & structure — be ambitious. Flag oversized
               files, tangled conditionals, and leaky or redundant
               abstractions. Actively look for "code judo": behavior-
               preserving restructurings that make whole branches, helpers,
               modes, or layers disappear and leave the change feeling
               inevitable in hindsight. Do not settle for local cleanup.
            4. DevEx regressions — confusing APIs, footguns, missing types at
               module boundaries, silent failure modes.

            ${{ inputs.review-focus != '' && format('Project-specific emphasis: {0}', inputs.review-focus) || '' }}

            As you work, narrate what you're doing — say which files you're
            reading and what you're checking — so the run is easy to follow.

            Output rules:
            - Group findings as Blocker / Suggestion / Nit, each with
              file:line and a concrete proposed fix (or diff snippet).
            - Tag every finding [high-confidence] or [speculative]. This
              review is intentionally aggressive and will over-flag, so be
              honest about certainty to keep triage cheap.
            - If a single high-leverage structural move exists, lead with it.
            - Be concise and specific. No praise, no restating the diff.
            - Post inline comments on the relevant lines.
            - Your summary is posted as a PR *comment* (the tracking comment
              this action maintains), NOT as a formal GitHub review. Downstream
              automation keys off this comment, so it must always appear.
            - ALWAYS post a summary comment, even when the review is clean, and
              begin it with this exact marker line so it is unambiguously
              identifiable by both humans and automation:

                  ## Thermonuclear Review

              Below the marker, update the tracking comment with: the files you
              reviewed, a count of findings by severity, and the grouped
              findings. If you found nothing worth flagging, say so explicitly
              (e.g. "✅ No blocking issues; N nits below") rather than leaving
              it empty.
