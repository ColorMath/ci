name: CI

# Self-hosting check: every colormath PR runs its own reusable gate suite
# against example/ (a minimal compliant consumer). A gates change that can't
# pass here can't be tagged. The suite includes the gitleaks gate, which scans
# this repo's full history — colormath is public, so that gate is
# non-negotiable.
#
# colormath-ref is the PR's own SHA so the gate scripts and composite actions
# under test are the ones from this change, not the last release.

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Named so `run:` steps get `bash --noprofile --norc -eo pipefail {0}` rather
# than GitHub's implicit `bash -e {0}`. Without pipefail, a step whose command
# is piped — `… | tee "$GITHUB_OUTPUT"` below, for one — exits with the
# pipeline's LAST status and reports success however the command fared. See
# release/verify-gate-shells.sh, which fails the build if a job loses this.
defaults:
  run:
    shell: bash

jobs:
  # Every version this repo writes down must agree, and must name a tag that
  # exists. Consumers pin exact tags, so a stamp naming an untagged version
  # means every consumer's `make preflight` 404s on every gate script, and a
  # stamp naming an older tag means CI and the local mirror silently run
  # different gate scripts. Both have happened; see release/verify.sh.
  #
  # Safe to block, despite LIFECYCLE.md's warning about drift gates, because it
  # can only fail on a PR that edited a version string. A PR touching none of
  # them inherits main's consistent state and passes unconditionally — this
  # gate can never stand between a hotfix and main.
  release-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # verify.sh compares the stamps against the newest reachable tag.
          fetch-depth: 0
      - run: ./release/verify.sh

  # Structural, and blocking for the same reason release-consistency is: it can
  # only fail on a PR that edited a workflow's `defaults.run`. It has to be a
  # check of its own rather than something the gate suite below would catch,
  # because the failure it guards against is precisely one that makes that
  # suite report success.
  gate-shells:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: ./release/verify-gate-shells.sh

  gates:
    uses: ./.github/workflows/gates.yml
    with:
      workdir: example
      python-version: "3.12"
      default-branch: main
      colormath-ref: ${{ github.sha }}
      # Every gate is default-on as of v2.0.0; the self-test takes the defaults
      # and exercises the whole suite against example/.
